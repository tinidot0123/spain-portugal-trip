<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>2027 西葡 12 天雙國之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --ink:#3E3A39; --soft:#5E5856;
  --coral:#F2A497; --yellow:#F6D27A; --blue:#A8D3E6; --green:#B9DAA5; --white:#FFFFFF;
  --bw:3px; --r:22px; --nav:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light;scroll-behavior:smooth;scroll-padding-top:calc(var(--nav) + 12px)}
body{margin:0;padding-top:var(--nav);background:var(--paper);color:var(--ink);
  font-family:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p,ul,ol{margin:0}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
section{padding:34px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- 固定選單 ---------- */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:100;background:var(--paper);border-bottom:var(--bw) solid var(--ink)}
.nav nav{max-width:680px;margin:0 auto;height:100%;display:flex;gap:6px;align-items:center;justify-content:space-between;padding:0 10px}
.nav a{flex:1;text-decoration:none;color:var(--ink);text-align:center;font-size:13px;line-height:1.15;padding:5px 2px;border:var(--bw) solid transparent;border-radius:16px;transition:background .2s,transform .2s}
.nav a i{display:block;font-style:normal;font-size:17px}
.nav a.on{background:var(--yellow);border-color:var(--ink)}
.nav a:active{transform:scale(.94)}

/* ---------- 標題貼紙 ---------- */
h2.title{display:inline-block;font-size:22px;font-weight:400;background:var(--blue);border:var(--bw) solid var(--ink);border-radius:999px;padding:2px 18px;margin-bottom:16px;transform:rotate(-1.5deg)}
h2.title.c1{background:var(--coral)} h2.title.c2{background:var(--yellow)} h2.title.c3{background:var(--green)}

/* ---------- 首頁 ---------- */
#home{padding-top:18px}
.hero-art{background:var(--blue);border:var(--bw) solid var(--ink);border-radius:30px;overflow:hidden}
.hero-art svg{display:block;width:100%;height:auto}
.hero-text{text-align:center;padding:18px 4px 6px}
.kicker{display:inline-block;background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:999px;padding:0 14px;font-size:14px}
h1{font-size:34px;line-height:1.25;font-weight:400;margin:10px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:8px 0 4px;font-size:14px}
.chip{border:var(--bw) solid var(--ink);border-radius:999px;padding:0 11px}
.chip.l{background:var(--yellow)} .chip.p{background:var(--blue)} .chip.m{background:var(--coral)} .chip.b{background:var(--green)}
.who{font-size:14px;color:var(--soft);margin-top:6px}
.count{margin-top:18px;background:var(--white);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:16px 14px 18px;text-align:center}
.count p{font-size:15px}
.count small{display:block;color:var(--soft);font-size:12.5px;margin-top:10px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cd div{border:var(--bw) solid var(--ink);border-radius:18px;padding:6px 0 4px}
.cd div:nth-child(1){background:var(--coral)} .cd div:nth-child(2){background:var(--yellow)}
.cd div:nth-child(3){background:var(--blue)} .cd div:nth-child(4){background:var(--green)}
.cd b{display:block;font-size:30px;line-height:1.1;font-weight:400;font-variant-numeric:tabular-nums}
.cd span{font-size:12.5px}
.count .done{font-size:20px;padding:8px 0}

/* ---------- 航班 ---------- */
.note-s{font-size:13px;color:var(--soft);margin:-6px 0 14px}
.flight{background:var(--white);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:12px 14px 12px;margin-bottom:14px;position:relative}
.f-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;border:var(--bw) solid var(--ink);border-radius:999px;padding:0 11px;font-size:14px;background:var(--yellow)}
.pill.k-air{background:var(--coral)} .pill.k-train{background:var(--blue)}
.f-no{font-size:15px}
.f-ok{margin-left:auto;background:var(--green);border:var(--bw) solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px}
.f-wait{margin-left:auto;background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px}
.f-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:10px 0 6px;text-align:center}
.f-main .t{font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.f-main .t sup{font-size:12px;color:var(--soft)}
.f-main .c{font-size:13px;color:var(--soft);line-height:1.35}
.f-main .arrow{font-size:20px}
.f-note{font-size:14px;color:var(--soft);border-top:3px dotted var(--ink);padding-top:8px;margin-top:4px}

/* ---------- 每日行程 ---------- */
.tabs{position:sticky;top:var(--nav);z-index:50;background:var(--paper);border-bottom:var(--bw) solid var(--ink)}
.tabs-in{max-width:680px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;scroll-snap-align:center;min-width:66px;background:var(--white);border:var(--bw) solid var(--ink);border-radius:18px;padding:3px 8px 4px;text-align:center;line-height:1.3;position:relative}
.tab small{display:block;font-size:11.5px;color:var(--soft)}
.tab b{font-weight:400;font-size:15px}
.tab::after{content:"";position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:var(--cc,var(--yellow))}
.tab[aria-selected="true"]{background:var(--yellow);transform:translateY(-2px)}
.tab.bounce{animation:chipBounce .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes chipBounce{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-10px) scale(1.07)}65%{transform:translateY(1px) scale(.97)}100%{transform:translateY(-2px) scale(1)}}

.panel{margin-top:18px;outline:none}
.panel.pop{animation:popIn .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes popIn{0%{transform:translateY(22px) scale(.95);opacity:0}55%{transform:translateY(-5px) scale(1.01);opacity:1}80%{transform:translateY(1px) scale(.998)}100%{transform:none;opacity:1}}
.banner{border:var(--bw) solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.banner svg{display:block;width:100%;height:auto}
.dayhead{margin-top:14px;background:var(--white);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:12px 14px 14px}
.dayno{display:inline-block;background:var(--cc);border:var(--bw) solid var(--ink);border-radius:999px;padding:0 12px;font-size:13.5px}
.dayhead h3{font-size:19px;line-height:1.4;font-weight:400;margin:8px 0 6px}
.dayhead p{font-size:14.5px;margin-top:6px}
.dayhead p b{display:inline-block;font-weight:400;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:0 9px;font-size:12.5px;margin-right:6px}
.dayhead .tip{background:var(--paper);border:2px dashed var(--ink);border-radius:14px;padding:6px 10px;margin-top:10px}

.timeline{list-style:none;padding:0;margin:20px 0 0;position:relative}
.timeline::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:3px;background:var(--ink);border-radius:3px}
.tl{position:relative;padding-left:40px;margin-bottom:14px}
.tl::before{content:"";position:absolute;left:2px;top:15px;width:21px;height:21px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--blue)}
.tl.must::before{background:var(--coral)}
.tl .card{background:var(--white);border:var(--bw) solid var(--ink);border-radius:18px;padding:9px 12px 10px;position:relative}
.time{display:inline-block;font-size:13px;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:0 9px;line-height:1.55}
.tl h4{font-size:16.5px;line-height:1.45;font-weight:400;margin:6px 0 2px;padding-right:2px}
.tl .nt{font-size:14px;color:var(--soft);line-height:1.65;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{display:inline-block;font-size:12.5px;line-height:1.5;border:2px solid var(--ink);border-radius:999px;padding:0 9px;background:var(--white)}
.tag.green{background:var(--green)} .tag.coral{background:var(--coral)} .tag.blue{background:var(--blue)} .tag.yellow{background:var(--yellow)}
.tag.must{background:var(--coral);transform:rotate(-3deg);padding:0 10px}
.tag.booked{background:var(--green)}
.tag.reserve{background:var(--yellow)}
.tag.plan{background:var(--blue)}

/* ---------- 住宿 ---------- */
.stay{background:var(--white);border:var(--bw) solid var(--ink);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.stay-h{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--cc);border-bottom:var(--bw) solid var(--ink);padding:7px 14px;font-size:16px}
.stay-h span{background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px}
.stay-b{padding:10px 14px 12px}
.stay-b h3{font-size:18px;line-height:1.4;font-weight:400}
.stay-b dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:14.5px}
.stay-b dt{color:var(--soft)} .stay-b dd{margin:0}

footer{text-align:center;padding:30px 16px 46px;font-size:14px;color:var(--soft)}
footer svg{width:120px;height:auto;display:block;margin:0 auto 6px}

/* ---------- 插畫動畫 ---------- */
svg *{transform-box:fill-box}
.a-rays{transform-origin:center;animation:spin 40s linear infinite}
.a-bob{animation:bob 3.4s ease-in-out infinite}
.a-bob2{animation:bob 4.6s ease-in-out infinite reverse}
.a-cloud{animation:drift 12s ease-in-out infinite alternate}
.a-cloud2{animation:drift 16s ease-in-out infinite alternate-reverse}
.a-plane{animation:fly 9s ease-in-out infinite alternate}
.a-tram{animation:tram 3.2s ease-in-out infinite alternate}
.a-wave{animation:wave 3s linear infinite}
.a-pulse{transform-origin:center;animation:pulse 3.6s ease-in-out infinite}
.a-wag{transform-origin:left center;animation:wag 2.4s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(16px)}}
@keyframes fly{0%{transform:translate(-14px,3px) rotate(-2deg)}100%{transform:translate(28px,-7px) rotate(2deg)}}
@keyframes tram{0%{transform:translateX(-4px) rotate(-.5deg)}100%{transform:translateX(12px) rotate(.6deg)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-20px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes wag{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}

@media (min-width:600px){
  h1{font-size:42px}
  .cd b{font-size:38px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<header class="nav">

<main>
<!-- ================= 首頁 ================= -->

<!-- ================= 航班 ================= -->
<section id="flights">
  <div class="wrap">
    <h2 class="title c1">✈️ 航班與跨城交通</h2>

   ['17:25–18:10','☕ 精品咖啡：Nomad Coffee Lab & Shop','從屋頂酒吧搭計程車約 8 分鐘抵達波恩區私密綠意巷弄（Passatge Sert, 12）。在打烊前品嚐巴塞隆納最頂尖的獨立烘焙手沖或 Flat White。\n若在屋頂酒吧停留較晚超過 18:00，可改去步行 5 分鐘外的分支據點 Nomad Everyday。',['計程車']],
   ['18:15–19:15','🍰 甜點：Jon Cake ＆ 波恩區散步','從 Nomad 步行 4 分鐘即達！外帶或現場品嚐全巴塞隆納最紅、濃郁絲滑的流心巴斯克乳酪蛋糕。',['步行']],
   ['19:30–21:30','🎶 加泰隆尼亞音樂宮音樂會 (Palau de la Música Catalana)','20:00 音樂會已訂妥！務必於 19:30 提早進場，在大廳與二樓露台拍攝絕美的「倒置水滴狀彩繪玻璃天窗」與馬賽克玫瑰花柱。',[],'must,booked'],
   ['21:30–23:00','🍷 晚餐 / 微醺：Can Cisa / Bar Brutal','音樂會結束後步行 7 分鐘深入波恩區，在巴塞隆納最具指標性的自然酒餐酒館品飲精選自然酒配精緻佐酒料理。',['步行']]
  ]},
 {n:10,date:'2/12',wd:'五',city:'barcelona',
  title:'Montserrat 聖山奇岩一日遊・擴展區美食與世界第一調酒',
  theme:'登鋸齒聖山參拜黑面聖母、高空纜車與奇岩健行步道、道地加泰隆尼亞通心粉與流心烘蛋、世界第一調酒 Sips。',
  route:'西班牙廣場站 ➔ FGC R5 ➔ 蒙特塞拉特修道院 ➔ 聖胡安纜車 ➔ 返回市區 ➔ Bar Bocata 2 Diagonal ➔ Sips',
  items:[
   ['08:00–08:30','早餐 ＆ 前往西班牙廣場站 (Plaça Espanya)','準備出發前往近郊聖山。',[]],
   ['08:36–10:00','搭乘 FGC R5 火車 ➔ 轉乘登山纜車 (Aeri) 或齒軌火車','於 Plaça Espanya 站搭乘 R5 線火車，於 Aeri de Montserrat 站轉乘高空風景纜車（或於 Monistrol 轉乘齒軌火車 Cremallera）直達海拔 720 公尺修道院。',['火車','纜車','齒軌火車']],
   ['10:15–12:00','⛰️ 蒙特塞拉特修道院 ＆ 參拜黑面聖母 (La Moreneta)','依預約時段進入大殿親手觸摸巴塞隆納守護神「黑面聖母」手中圓球祈福，參觀大教堂與中庭廣場（若時間對上可於 13:00 聆聽歐洲最古老的 Escolania 男童合唱團天籟）。',[],'must,reserve:依預約時段'],
   ['12:15–14:30','聖胡安纜車 (Funicular de Sant Joan) ＆ 奇岩全景步道','搭乘陡峭山壁纜車登上 1,000 公尺高處，漫步於高第建築靈感來源的鋸齒狀奇岩步道，俯瞰加泰隆尼亞平原壯闊全景，並於山上簡單果腹。',['纜車','步行'],'must'],
   ['14:30–16:15','下山返回巴塞隆納市區','搭乘纜車與火車返回西班牙廣場站。',['纜車','火車']],
   ['16:15–19:00','返回飯店午茶與充分休息','聖山健行後回飯店泡澡、歇腿休息，換裝準備迎接週五微醺之夜。',[]],
   ['19:30–21:00','🍴 晚餐：Bar Bocata 2 Diagonal','位於擴展區的高人氣時髦餐館！必點招牌起司肉醬通心粉 (Macarrones de la abuela)、流心馬鈴薯烘蛋 (Tortilla) 與伊比利火腿可樂餅。',[]],
   ['21:30–23:00','🍸 酒吧：Sips (Drinkery House)','由傳奇調酒師 Simone Caporale 與 Marc Álvarez 聯手打造、榮登「世界 50 大酒吧第一名」的殿堂級酒吧！打破傳統吧台隔閡，體驗如同劇場藝術般的分子創意調酒。',[],'must']
  ]},
 {n:11,date:'2/13',wd:'六',city:'barcelona',
  title:'地中海海岸小鎮漫遊（Sitges / Blanes 雙方案）・精品大道採買・Gresca 週末饗宴',
  theme:'地中海冬日暖陽與白色海濱小鎮（依當日天氣與心情二選一）、格拉西亞大道精品與伴手禮採買、米其林推薦現代加泰隆尼亞料理 Gresca。',
  route:'Passeig de Gràcia 站 ➔ Sitges（方案 A）或 Blanes（方案 B）➔ 格拉西亞大道 ➔ Hotel Pulitzer ➔ Gresca',
  items:[
   ['08:30–09:30','悠閒早餐 ＆ 前往火車站','睡到自然醒享用早餐，步行前往 Passeig de Gràcia 車站（或 Sants 車站）。',['步行']],
   ['09:30–15:30','🌊 錫切斯 (Sitges) 白色藝術海濱小鎮','車程僅 35–40 分鐘，班次最密集。\n• 09:40–10:20 交通：於 Passeig de Gràcia 站搭乘 Rodalies R2 Sud 近郊火車直達 Sitges。\n• 10:20–12:30 老城與海岸散步：穿過純白藍窗的地中海巷弄，造訪矗立於海岬礁石上的粉紅地標聖巴托洛梅與聖特克拉教堂 (Església de Sant Bartomeu i Santa Tecla)；參觀現代主義大師聖地亞哥．魯西尼奧爾的藍白磁磚故居考費拉特博物館 (Museu del Cau Ferrat) 與瑪麗賽爾宮 (Palau de Maricel) 絕美海景拱廊。\n• 12:30–14:15 海濱午餐：沿棕櫚樹搖曳的 Passeig Marítim 海濱大道散步，於海景餐廳（如 El Vivero 或 La Zorra）享用道地加泰隆尼亞烤蔥 (Calçots) 或地中海海鮮飯配白酒。\n• 14:30–15:15 返程：搭火車返回巴塞隆納市區。',['火車','步行'],'must,plan:方案 A・首選'],
   ['同時段替代','🌿 布拉內斯 (Blanes) 懸崖植物園','布拉瓦海岸起點，適合極度晴朗天氣。\n• 09:00–10:25 交通：搭乘 Rodalies R1 海岸線火車（沿途緊貼地中海行駛，坐右側靠窗海景極美）抵達 Blanes，轉乘計程車 8 分鐘上山。\n• 10:35–12:30 瑪麗穆特拉植物園 (Jardí Botànic Marimurtra)：歐洲最美懸崖植物園！漫步於百尺峭壁上的亞熱帶森林，在全白古典圓亭林奈神殿 (Templet de Linné) 俯瞰寶石藍地中海灣與奇岩。\n• 12:45–14:15 漁港午餐：下山至 Blanes 漁港旁享用現撈海鮮午餐，並打卡海岸分界巨石 Sa Palomera。\n• 14:15–15:40 返程：搭車返回巴塞隆納市區。',['火車','計程車'],'plan:方案 B・替代'],
   ['15:30–18:15','🛍 格拉西亞大道 (Passeig de Gràcia) ＆ 蘭布拉大道伴手禮採買','返回市區展開最後黃金採買時光：\n• 精品與設計：漫步格拉西亞大道欣賞華麗街燈長椅，逛西班牙皇室皮具 Loewe 旗艦店與在地服飾品牌。\n• 美食伴手禮：前往 El Corte Inglés 英國宮百貨超市（就在飯店旁）或百年老店 Colmado Múrria，採買頂級 100% 橡果飼養伊比利火腿真空包 (Jamón Ibérico de Bellota)、鵝肝醬、西班牙早摘橄欖油，並至 Vicens 選購手工杏仁牛軋糖 (Turrón)。',['步行']],
   ['18:15–19:30','返回 Hotel Pulitzer 休息 ＆ 預先整理大件行李','把採購戰利品與明日要托運的大件行李先整理妥當，換裝準備前往晚間重頭戲。',[]],
   ['20:00–22:00','🍽 晚餐：Gresca','巴塞隆納老饕與美食家一致推崇的米其林推薦現代料理名店（主廚 Rafa Peña 主理）。可選擇坐溫馨料理區或充滿活力的 Wine Bar 區，必點招牌 Gresca 比基尼三明治（松露起司火腿）、酥炸腦花或當季野味海鮮創意料理，搭配侍酒師精選的自然酒或陳年佳釀，為西葡之旅最後一晚畫下完美句點！',[],'must']
  ]},
 {n:12,date:'2/14',wd:'日',city:'barcelona',
  title:'巴特婁之家・El Born 漫步・林蔭大道告別午餐與搭機返台',
  theme:'高第海洋奇幻建築、文藝街區晨間漫步、完美順路告別午餐、從容退稅返台。',
  route:'Hotel Pulitzer ➔ 米拉之家 ➔ 巴特婁之家 ➔ Rambla de Catalunya ➔ La Flauta ➔ BCN 機場 ➔ 返台',
  items:[
   ['08:45–09:30','早餐、辦理退房並寄放行李','於飯店完成退房，將行李寄放於 Hotel Pulitzer 櫃檯，輕裝出門。',[]],
   ['09:30–10:00','米拉之家外觀 (Casa Milà / La Pedrera) ＆ 格拉西亞大道散步','趁早晨人潮未湧現，欣賞米拉之家波浪形石造立面與鍛鐵陽台，再往回散步 5 分鐘至巴特婁之家。',['步行']],
   ['10:00–11:30','🐉 巴特婁之家 (Casa Batlló)','預約 10:00 場次。走進高第以「海洋」與「聖喬治屠龍傳說」為靈感打造的魔幻宅邸：細賞深淺漸層藍色磁磚天井、蘑菇壁爐、巨龍鱗片屋頂與沉浸式光影展廳。',[],'must,reserve:10:00 場次'],
   ['11:30–12:25','加泰隆尼亞蘭布拉大道 (Rambla de Catalunya) 或 El Born 漫步','把握在巴塞隆納最後的冬日暖陽，沿著綠樹成蔭、充滿獨立小店與露天座位的林蔭大道悠閒漫步。',['步行']],
   ['12:30–14:00','🍴 告別午餐：La Flauta','Rambla de Catalunya 分店。',[]],
   ['14:00–14:20','順路散步返回 Hotel Pulitzer 領取行李','從餐廳沿著 Rambla de Catalunya 直走下坡約 10 分鐘即回到飯店，完全不走回頭路。',['步行']],
   ['14:20–15:00','前往巴塞隆納機場 (BCN T1)','搭乘計程車（或加泰隆尼亞廣場直達的 Aerobus A1 機場巴士）前往第一航廈。',['計程車','機場巴士']],
   ['15:00–18:20','辦理 DIVA 機器退稅、行李托運與免稅店最後巡禮','西班牙購物極為便利：先在機場海關處掃描退稅單條碼（DIVA 機台顯示綠勾即完成，無須排人工蓋章），隨後辦理土航報到與安檢。',[]],
   ['18:20 ➔ 2/15 17:40','✈️ 搭乘土耳其航空 TK 1856 ➔ 轉機 TK 24 返抵台北','18:20 起飛，23:55 抵達伊斯坦堡（轉機 2 小時）；01:55 搭乘 TK 24 起飛，於 2/15 (一) 17:40 平安返抵台北桃園機場！',['飛機']]
  ]}
];

  '<circle cx="14" cy="18" r="3.5" fill="#F2A497" stroke-width="2"/><circle cx="26" cy="22" r="3.5" fill="#A8D3E6" stroke-width="2"/>'+
  '<path d="M12 28 V36 M34 28 V36" fill="none"/></g></g>'+
'</svg>'
};

/* ============================================================
   小工具
   ============================================================ */
var $ = function(s,r){return (r||document).querySelector(s)};
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
var smooth = function(){return reduce.matches ? 'auto' : 'smooth'};
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function rich(s){return esc(s).replace(/\n/g,'<br>')}

var TAGS = [
  ['步行','🚶','green'],['飛機','✈️','coral'],['高鐵','🚄','blue'],['火車','🚆','blue'],
  ['纜車','🚡',''],['電車','🚋',''],['巴士','🚌',''],['地鐵','🚇',''],['大眾','🚇',''],
  ['Bolt','🚕','yellow'],['Uber','🚕','yellow'],['計程車','🚕','yellow'],['叫車','🚕','yellow'],['搭車','🚕','yellow'],
  ['交通工具','🚌','']
];
function transTag(label){
  for(var i=0;i<TAGS.length;i++){
    if(label.indexOf(TAGS[i][0])>-1) return '<span class="tag '+TAGS[i][2]+'">'+TAGS[i][1]+' '+esc(label)+'</span>';
  }
  return '<span class="tag">'+esc(label)+'</span>';
}
function flagTags(f){
  var out='';
  (f||'').split(',').forEach(function(x){
    if(!x) return;
    var p=x.split(':'), k=p[0], v=p.slice(1).join(':');
    if(k==='must') out='<span class="tag must">★ 必去</span>'+out;
    else if(k==='booked') out+='<span class="tag booked">✅ 已訂妥</span>';
    else if(k==='reserve') out+='<span class="tag reserve">📌 '+esc(v||'需預約')+'</span>';
    else if(k==='plan') out+='<span class="tag plan">'+esc(v)+'</span>';
  });
  return out;
}

/* ============================================================
   倒數
   ============================================================ */
function pad(n){return n<10?'0'+n:''+n}
function tick(){
  var d=TRIP_START-Date.now();
  if(d<=0){
    $('#cdBoxes').innerHTML='<div class="done" style="grid-column:1/-1;background:#B9DAA5">旅程已經出發囉！一路順風 ✈️</div>';
    $('#cdLabel').textContent='西葡之旅';
    clearInterval(timer);
    return;
  }
  var s=Math.floor(d/1000);
  $('#cdD').textContent=Math.floor(s/86400);
  $('#cdH').textContent=pad(Math.floor(s%86400/3600));
  $('#cdM').textContent=pad(Math.floor(s%3600/60));
  $('#cdS').textContent=pad(s%60);
}
var timer=setInterval(tick,1000); tick();

/* ============================================================
   航班
   ============================================================ */
(function(){
  var h='';
  FLIGHTS.forEach(function(f){
    var icon=f.k==='train'?'🚄':'✈️';
    var st=f.st==='ok'?'<span class="f-ok">✅ '+f.stTxt+'</span>':(f.st==='wait'?'<span class="f-wait">⏳ '+f.stTxt+'</span>':'');
    h+='<article class="flight">'+
      '<div class="f-top"><span class="pill k-'+f.k+'">'+esc(f.d)+'</span><span class="f-no">'+icon+' '+esc(f.no)+'</span>'+st+'</div>'+
      '<div class="f-main">'+
        '<div><div class="t">'+esc(f.f[0])+'</div><div class="c"><b style="font-weight:400">'+esc(f.f[1])+'</b><br>'+esc(f.f[2])+'</div></div>'+
        '<div class="arrow">➜</div>'+
        '<div><div class="t">'+esc(f.t[0])+(f.plus?'<sup>'+f.plus+'</sup>':'')+'</div><div class="c"><b style="font-weight:400">'+esc(f.t[1])+'</b><br>'+esc(f.t[2])+'</div></div>'+
      '</div>'+
      '<p class="f-note">'+esc(f.note)+'</p>'+
    '</article>';
  });
  $('#flightList').innerHTML=h;
})();

/* ============================================================
   每日行程
   ============================================================ */
var tabsEl=$('#tabs'), panel=$('#panel'), cur=-1;

function buildTabs(){
  var h='';
  DAYS.forEach(function(d,i){
    h+='<button type="button" class="tab" role="tab" id="tab'+i+'" aria-selected="false" aria-controls="panel" data-i="'+i+'" style="--cc:'+CITY[d.city].cc+'">'+
       '<small>DAY '+d.n+'</small><b>'+d.date+' '+d.wd+'</b></button>';
  });
  tabsEl.innerHTML=h;
}

function panelHTML(d){
  var c=CITY[d.city];
  var items=d.items.map(function(it){
    var fl=it[4]||'';
    var must=/(^|,)must(,|$)/.test(fl);
    var tags=(it[3]||[]).map(transTag).join('')+flagTags(fl);
    return '<li class="tl'+(must?' must':'')+'"><div class="card">'+
      '<span class="time">'+esc(it[0])+'</span>'+
      '<h4>'+esc(it[1])+'</h4>'+
      (it[2]?'<p class="nt">'+rich(it[2])+'</p>':'')+
      (tags?'<div class="tags">'+tags+'</div>':'')+
    '</div></li>';
  }).join('');
  return '<div class="banner" style="--bg:'+c.bg+'">'+BANNERS[d.city]+'</div>'+
    '<div class="dayhead" style="--cc:'+c.cc+'">'+
      '<span class="dayno">DAY '+d.n+'｜'+d.date+' ('+d.wd+')</span>'+
      '<h3>'+esc(d.title)+'</h3>'+
      '<p><b>今日主題</b>'+esc(d.theme)+'</p>'+
      '<p><b>當日動線</b>'+esc(d.route)+'</p>'+
      (d.tip?'<p class="tip">💡 '+esc(d.tip)+'</p>':'')+
    '</div>'+
    '<ol class="timeline">'+items+'</ol>';
}

function retrigger(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

function show(i,opts){
  opts=opts||{};
  if(i<0||i>=DAYS.length||i===cur) return;
  cur=i;
  var tabs=tabsEl.querySelectorAll('.tab');
  tabs.forEach(function(t,k){t.setAttribute('aria-selected',k===i?'true':'false');t.tabIndex=k===i?0:-1});
  var t=tabs[i];
  retrigger(t,'bounce');
  tabsEl.scrollTo({left:t.offsetLeft-(tabsEl.clientWidth-t.offsetWidth)/2,behavior:opts.init?'auto':smooth()});
  panel.setAttribute('aria-labelledby','tab'+i);
  panel.innerHTML=panelHTML(DAYS[i]);
  if(!opts.init) retrigger(panel,'pop');
  if(!opts.init){
    var bar=tabsEl.parentElement.getBoundingClientRect().height;
    var top=panel.getBoundingClientRect().top+window.scrollY-parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav'))-bar-10;
    if(window.scrollY>top) window.scrollTo({top:top,behavior:smooth()});
  }
}

buildTabs();
tabsEl.addEventListener('click',function(e){
  var b=e.target.closest('.tab'); if(b) show(+b.dataset.i);
});
tabsEl.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    var n=cur+(e.key==='ArrowRight'?1:-1);
    if(n>=0&&n<DAYS.length){show(n);tabsEl.querySelectorAll('.tab')[n].focus();e.preventDefault();}
  }
});
/* 左右滑動切換日期 */
(function(){
  var sx=0,sy=0;
  panel.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  panel.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8) show(cur+(dx<0?1:-1));
  },{passive:true});
})();

/* 旅程期間自動停在當天，否則 Day 1 */
(function(){
  var start=cur=-1, now=new Date(), idx=0;
  var base=new Date('2027-02-03T00:00:00+01:00').getTime();
  var diff=Math.floor((now.getTime()-base)/86400000);
  if(diff>=0&&diff<DAYS.length) idx=diff;
  show(idx,{init:true});
})();

/* ============================================================
   住宿
   ============================================================ */
(function(){
  var h='';
  STAYS.forEach(function(s){
    h+='<article class="stay"><div class="stay-h" style="--cc:'+s.c+'"><b style="font-weight:400">'+esc(s.city)+'</b><span>'+s.n+' 晚</span></div>'+
      '<div class="stay-b"><h3>'+esc(s.name)+'</h3><dl>'+
      '<dt>入住</dt><dd>'+esc(s.in)+'</dd><dt>退房</dt><dd>'+esc(s.out)+'</dd>'+
      '<dt>預訂</dt><dd>'+esc(s.who)+'</dd><dt>備註</dt><dd>'+esc(s.note)+'</dd></dl></div></article>';
  });
  $('#stayList').innerHTML=h;
})();

/* ============================================================
   選單高亮
   ============================================================ */
(function(){
  var links=document.querySelectorAll('.nav a'), secs=[].map.call(links,function(a){return document.getElementById(a.dataset.s)});
  function on(){
    var y=window.scrollY+90, k=0;
    secs.forEach(function(s,i){if(s.offsetTop<=y)k=i});
    if(window.innerHeight+window.scrollY>=document.body.scrollHeight-4) k=secs.length-1;
    links.forEach(function(a,i){a.classList.toggle('on',i===k)});
  }
  window.addEventListener('scroll',on,{passive:true});window.addEventListener('resize',on);on();
})();
</script>
